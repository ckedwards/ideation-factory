name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # Pinned, so a new Ubuntu image is a change we choose, not one that arrives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint and format
        run: bun run lint
      # bun run test starts a fresh test engine and stops it afterwards
      - name: Test
        run: bun run test

  # Whether each package's stories could have changed: the package and those
  # it builds from (ui's: ui and core, whose Markdown the stories render; web's:
  # web, ui, core and api), what they resolve to in bun.lock (not just any
  # lockfile change), the shared TypeScript settings, or this workflow;
  # scripts/ci-changes.ts decides. Skipping a job counts as passing it.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - id: diff
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # a new branch has no "before": compare with master
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=origin/master
          fi
          bun scripts/ci-changes.ts "$BEFORE" "$AFTER" >> "$GITHUB_OUTPUT"

  # The ui package's stories, as tests: each renders in headless Chromium, runs
  # its play function and passes axe's accessibility checks, in every theme.
  # Then Storybook builds, as it would be published. Storybook and Vitest run
  # on Node, so this job sets up Node beside Bun.
  storybook:
    name: ui/storybook
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      # the browser only: the runner image already has Chrome's system libraries
      - name: Install Chromium
        run: bun x playwright install chromium-headless-shell
      - name: Test the stories
        run: bun run test:stories
      - name: Build Storybook
        run: bun run build-storybook

  # The web app's own stories, tested as ui's are, then its Storybook and the
  # app itself built. The routes' generated tree is committed (typecheck reads
  # it), so the build must not change it.
  web:
    name: web/storybook
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun x playwright install chromium-headless-shell
      - name: Test the stories
        run: bun run test:stories
      - name: Build Storybook
        run: bun run build-storybook
      - name: Build the app
        run: bun run build
      - name: Check the route tree is committed as built
        run: git diff --exit-code src/routeTree.gen.ts

  # Every new commit's message follows CONTRIBUTING.md, including ones that
  # skipped the local commit-msg hook (git commit --no-verify, or a tool that
  # doesn't run hooks).
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # a new branch has no "before": check what it adds to master
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git merge-base origin/master "$AFTER")
          fi
          bun scripts/commit-lint.ts --range "$BEFORE..$AFTER"

  # Every action the workflows use is pinned in .github/workflows/actions.lock,
  # and each pin is still the commit its tag pointed to. The commit hook checks
  # the first part offline; this checks both, against GitHub.
  actions-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Check the lockfile
        run: gh actions-lock --verify
