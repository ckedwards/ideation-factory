name: Pull request

# A workflow of its own, so editing a pull request's title runs this check
# again without running all of CI
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # A squash merge makes the pull request's title the first line of its commit
  # on master, so the title follows the same rules as a commit's
  # (CONTRIBUTING.md), with "!" when one of its commits breaks something. It
  # runs on every edit, the description's too: a skipped run would count as
  # passing, and could hide a title that fails.
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: bun scripts/commit-lint.ts --title "$TITLE" "$RANGE"
