# The app with RivetKit's native module built with the fix for rivet-dev/rivet#5991 (build.sh),
# in place of the published one, from LOAD_RIVETKIT_MODULE (its full path). Load tests only: run.sh
# adds this with LOAD_RIVETKIT_FIX=1, and a deployment can (DEPLOYMENT.md), though the app-bench image
# is simpler there.
services:
  app:
    volumes: &fixed
      - ${LOAD_RIVETKIT_MODULE:?set LOAD_RIVETKIT_MODULE, the fixed module's full path}:/app/node_modules/.bun/@rivetkit+rivetkit-napi-linux-x64-gnu@${LOAD_RIVETKIT_VERSION:-3.0.6}/node_modules/@rivetkit/rivetkit-napi-linux-x64-gnu/rivetkit-napi.linux-x64-gnu.node:ro
  directory:
    volumes: *fixed
