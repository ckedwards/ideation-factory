# The load balancer: Caddy, on a machine of its own, in front of the three
# VMs' apps. Or use your cloud's load balancer instead: TLS, the three apps'
# port 8080, and a health check on /health. See deploy/README.md.
#
#   docker compose -f lb.yaml up -d
name: ideaf-lb

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    environment:
      IDEAF_HOST: ${IDEAF_HOST:?set IDEAF_HOST, the name people reach this by}
      # the three apps, by private address: "10.0.0.11:8080 10.0.0.12:8080 10.0.0.13:8080"
      APP_NODES: ${APP_NODES:?set APP_NODES, the three apps' private addresses with port 8080}
      TLS_MODE: ${TLS_MODE:-internal}
      # proxies in front of this one whose X-Forwarded-For is believed (space-separated CIDRs); the
      # app nodes must list them in LB_ADDRESSES too
      LB_TRUSTED_PROXIES: ${LB_TRUSTED_PROXIES:-127.0.0.1/32}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_SERVER: ${ACME_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      ACME_CA_FILE: ${ACME_CA_FILE:-internal-ca.pem}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../../deploy/caddy/tls.caddy:/etc/caddy/tls.caddy:ro
      - ./tls:/tls:ro
      - ./ca:/ca:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
