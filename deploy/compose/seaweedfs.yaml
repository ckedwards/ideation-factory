# Ideation Factory on one machine, for trying it (README.md), with its bucket store beside it
# (SeaweedFS): nothing needed outside this machine but its name and, for email, outgoing port 25.
#
# Added to compose.yaml (seaweedfs.env.example's COMPOSE_FILE):
#
#   cp seaweedfs.env.example .env     then fill it in
#   docker compose up -d
services:
  # the engine starts once its bucket is there, and speaks plain HTTP to SeaweedFS on this machine
  engine:
    depends_on:
      buckets:
        condition: service_completed_successfully
    environment:
      AWS_ALLOW_HTTP: 'true'

  # the bucket store, on this machine
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: seaweedfs
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs:/data
    networks: [ideaf]

  # makes the two buckets
  buckets:
    image: chrislusf/seaweedfs:4.51
    depends_on: [seaweedfs]
    entrypoint: ['sh', '-c']
    command:
      - |
        until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 >/dev/null 2>&1; do sleep 1; done
        for bucket in "$$FILES" "$$ENGINE"; do
          echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 | grep -qw "$$bucket" \
            || echo "s3.bucket.create -name $$bucket" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
        done
    environment:
      FILES: ${S3_FILES_BUCKET:-ideaf-files}
      ENGINE: ${S3_ENGINE_BUCKET:-ideaf-engine}
    networks: [ideaf]

configs:
  seaweedfs:
    content: |
      {"identities": [
        {"name": "engine", "credentials": [{"accessKey": "${S3_ENGINE_ACCESS_KEY_ID}", "secretKey": "${S3_ENGINE_SECRET_ACCESS_KEY}"}],
          "actions": ["Read:${S3_ENGINE_BUCKET:-ideaf-engine}", "Write:${S3_ENGINE_BUCKET:-ideaf-engine}", "List:${S3_ENGINE_BUCKET:-ideaf-engine}", "Tagging:${S3_ENGINE_BUCKET:-ideaf-engine}"]},
        {"name": "files", "credentials": [{"accessKey": "${S3_FILES_ACCESS_KEY_ID}", "secretKey": "${S3_FILES_SECRET_ACCESS_KEY}"}],
          "actions": ["Read:${S3_FILES_BUCKET:-ideaf-files}", "Write:${S3_FILES_BUCKET:-ideaf-files}", "List:${S3_FILES_BUCKET:-ideaf-files}"]}]}

volumes:
  seaweedfs:
