# Ideation Factory on one machine, to try it (README.md): the engine and the app, from our published
# images, with everything kept in two Docker volumes on this machine. Not for production (../vm).
#
#   cp .env.example .env     fill in the two secrets and your email
#   docker compose up -d     then open http://localhost:8080
name: ideaf

services:
  # Rivet's engine on its own, as Rivet's own Compose guide runs it
  # (rivet.dev/docs/deploy/self-host/control-plane/docker-compose)
  engine:
    image: ghcr.io/ckedwards/ideation-factory/engine:${IDEAF_VERSION:-latest}
    restart: unless-stopped
    # it keeps more files open than Docker's soft limit of 1024 on many hosts
    ulimits:
      nofile: 524288
    environment:
      RIVET__AUTH__ADMIN_TOKEN: ${RIVET_ADMIN_TOKEN:?set RIVET_ADMIN_TOKEN in .env (openssl rand -hex 32)}
    configs:
      - source: engine
        target: /etc/rivet/config.yaml
    volumes:
      - engine:/var/lib/rivet

  # creates the engine's node pool, which the app joins; it drains an older app once a newer one connects
  pool:
    image: curlimages/curl:8.16.0
    depends_on: [engine]
    entrypoint: ['sh', '-c']
    command:
      - |
        until curl -sf -X PUT "http://engine:6420/pools/default?namespace=default" \
            -H "authorization: Bearer $$RIVET_ADMIN_TOKEN" -H 'content-type: application/json' \
            -d '{"drain_on_version_upgrade": true}'; do sleep 2; done
    environment:
      RIVET_ADMIN_TOKEN: ${RIVET_ADMIN_TOKEN}

  app:
    image: ghcr.io/ckedwards/ideation-factory/app:${IDEAF_VERSION:-latest}
    restart: unless-stopped
    # Rivet asks for at least 60 s for the app to hand its actors back; Docker's default is 10 s
    stop_grace_period: 60s
    depends_on:
      pool:
        condition: service_completed_successfully
    ports:
      - ${IDEAF_PORT:-8080}:8080
    environment:
      IDEAF_URL: ${IDEAF_URL:-http://localhost:8080}
      IDEAF_AUTH_SECRET: ${IDEAF_AUTH_SECRET:?set IDEAF_AUTH_SECRET in .env (openssl rand -hex 32)}
      IDEAF_SITE_ADMINS: ${IDEAF_SITE_ADMINS:-}
      RIVET_ENDPOINT: http://default:${RIVET_ADMIN_TOKEN}@engine:6420
      # sign-in codes in the app's log (docker compose logs app), unless IDEAF_SMTP_URL names a relay
      IDEAF_EMAIL: ${IDEAF_EMAIL:-log}
      IDEAF_SMTP_URL: ${IDEAF_SMTP_URL:-}
      IDEAF_EMAIL_FROM: ${IDEAF_EMAIL_FROM:-}
    volumes:
      # the files of every idea
      - app:/data

configs:
  engine:
    content: |
      storage:
        log_directory: /var/lib/rivet/log
        # one engine, which makes its own storage (a cluster waits for three)
        auto_provision_partitions: 1
        balancing:
          enabled: false
      object_storage:
        primary:
          file_system:
            path: /var/lib/rivet/objects

volumes:
  engine:
  app:
