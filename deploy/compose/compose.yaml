# Ideation Factory on one machine, to try it (README.md): the engine and the app, from our published
# images, with everything kept in two Docker volumes on this machine, and Mailpit catching the email.
# Not for production (../vm).
#
#   cp .env.example .env     fill in the two secrets and your email
#   docker compose up -d     then open http://localhost:8080, and http://localhost:8025 for the codes
name: ideaf

services:
  # Rivet's engine on its own, as Rivet's own Compose guide runs it
  # (rivet.dev/docs/deploy/self-host/control-plane/docker-compose)
  engine:
    image: ghcr.io/ckedwards/ideation-factory/engine:${IDEAF_VERSION:-latest}
    restart: unless-stopped
    # it keeps more files open than Docker's soft limit of 1024 on many hosts
    ulimits:
      nofile: 524288
    environment:
      RIVET__AUTH__ADMIN_TOKEN: ${RIVET_ADMIN_TOKEN:?set RIVET_ADMIN_TOKEN in .env (openssl rand -hex 32)}
    configs:
      - source: engine
        target: /etc/rivet/config.yaml
    volumes:
      - engine:/var/lib/rivet

  app:
    image: ghcr.io/ckedwards/ideation-factory/app:${IDEAF_VERSION:-latest}
    restart: unless-stopped
    # Rivet asks for at least 60 s for the app to hand its actors back; Docker's default is 10 s
    stop_grace_period: 60s
    # it makes the engine's node pool it joins, once the engine answers (a new one takes a minute)
    depends_on: [engine, mailpit]
    ports:
      - ${IDEAF_PORT:-8080}:8080
    environment:
      IDEAF__URL: ${IDEAF_URL:-http://localhost:8080}
      IDEAF__AUTH__SECRET: ${IDEAF_AUTH_SECRET:?set IDEAF_AUTH_SECRET in .env (openssl rand -hex 32)}
      IDEAF__SITE_ADMINS: ${IDEAF_SITE_ADMINS:-}
      IDEAF__ENGINE__ENDPOINT: http://engine:6420
      IDEAF__ENGINE__TOKEN: ${RIVET_ADMIN_TOKEN}
      # every email to Mailpit, unless IDEAF_SMTP_URL names a relay that delivers it
      IDEAF__EMAIL__SMTP_URL: ${IDEAF_SMTP_URL:-smtp://mailpit:1025}
      IDEAF__EMAIL__FROM: ${IDEAF_EMAIL_FROM:-Ideation Factory <sign-in@ideaf.localhost>}
      IDEAF__EMAIL__NOTIFY_FROM: ${IDEAF_NOTIFY_FROM:-Ideation Factory <notifications@ideaf.localhost>}
    volumes:
      # the files of every idea
      - app:/data

  # An inbox for every email the app sends, sign-in codes included, at http://localhost:8025. Nothing
  # reaches anyone's own address. It's on this machine only: anyone who can open it can sign in as
  # anyone.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MAILPIT_PORT:-8025}:8025

configs:
  engine:
    content: |
      storage:
        log_directory: /var/lib/rivet/log
        # one engine, which makes its own storage (a cluster waits for three)
        auto_provision_partitions: 1
        balancing:
          enabled: false
      object_storage:
        primary:
          file_system:
            path: /var/lib/rivet/objects

volumes:
  engine:
  app:
