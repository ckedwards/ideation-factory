# Ideation Factory on one machine, for trying it (README.md), with its files and the engine's data
# in two S3 buckets of yours (aws.env.example says what they need). Added to compose.yaml
# (aws.env.example's COMPOSE_FILE):
#
#   cp aws.env.example .env     then fill it in
#   docker compose up -d
services:
  # both reach the buckets over HTTPS, with a key each, each allowed only its own bucket
  engine:
    environment:
      AWS_ALLOW_HTTP: 'false'
